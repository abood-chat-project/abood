<body>

<header>
<h1>🎙️ عبود</h1>
<p>تواصل بصوتك وكتابتك بحرية</p>
</header>

<div class="people">
 <div class="person">
  <div class="avatar">👨</div>
  أحمد
 </div>
 <div class="person">
  <div class="avatar">👩</div>
  سارة
 </div>
 <div class="person">
  <div class="avatar">👦</div>
  محمد
 </div>
</div>

<section class="voice">
 <button class="mic" type="button" id="mic">🎤</button>
 <p>المحادثات الصوتية</p>
 <div class="wave">▂▅▇▃▆▂▇▅▃▆</div>
 <small id="voiceStatus">اضغط على الميكروفون</small>
</section>

<section class="chatbox">
 <h3>💬 محادثات عبود</h3>
 <div id="chat"></div>
<input id="username" placeholder="اكتب اسمك..." maxlength="30">
 <form id="form">
  <input id="msg" placeholder="اكتب رسالتك..." required maxlength="1000">
  <button class="send" type="submit">➤</button>
 </form>
</section>

<footer>
من تصميم المهندس عبد الحكيم خالد الجابري
</footer>

<script src="/socket.io/socket.io.js"></script>
<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("msg");
const mic = document.getElementById("mic");
const status = document.getElementById("voiceStatus");


function showMessage(data) {
  if (!data) return;

  const text = typeof data === "string" ? data : data.text;
  const name = typeof data === "string" ? "عبود" : (data.name || "عبود");

  if (typeof text !== "string") return;

  const message = document.createElement("div");
  message.className = "message";
  message.textContent = name + ": " + text;
  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}

function showVoice(data) {
  if (!data || typeof data.audio !== "string") return;

  const message = document.createElement("div");
  message.className = "message";

  const label = document.createElement("div");
  label.textContent = (data.name || "عبود") + ": 🎤 رسالة صوتية";

  const audio = document.createElement("audio");
  audio.controls = true;
  audio.src = data.audio;
  audio.style.maxWidth = "100%";

  message.appendChild(label);
  message.appendChild(audio);
  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}

let socket = null;

if (typeof io === "function") {
  socket = io();

  socket.on("chat message", showMessage);

  socket.on("chat history", function(messages) {
    if (!Array.isArray(messages)) return;
    chat.innerHTML = "";
    messages.forEach(showMessage);
  });

  socket.on("voice history", function(messages) {
    if (!Array.isArray(messages)) return;
    messages.forEach(showVoice);
  });

  socket.on("voice message", showVoice);
}

form.addEventListener("submit", function(e) {
 e.preventDefault();
 const text = input.value.trim();
if (!text) return;

if (socket && socket.connected) {
  socket.emit("chat message", {
    name: document.getElementById("username").value.trim() || "عبود",
    text: text
  });
} else {
  showMessage(text);
}

input.value = "";
});

 
let recorder;
let audioChunks = [];

mic.addEventListener("click", async function() {
  try {
    if (recorder && recorder.state === "recording") {
      recorder.stop();
      status.textContent = "جاري تجهيز الصوت...";
      return;
    }

    if (!navigator.mediaDevices?.getUserMedia ||
        !window.MediaRecorder) {
      status.textContent = "التسجيل غير مدعوم هنا";
      return;
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    audioChunks = [];
    recorder = new MediaRecorder(stream);

    recorder.ondataavailable = function(e) {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    recorder.onstop = function() {
      const audioBlob = new Blob(audioChunks, {
        type: recorder.mimeType
      });

      stream.getTracks().forEach(track => track.stop());

      if (audioBlob.size > 5000000) {
        status.textContent = "الصوت طويل جدًا، سجّل مقطعًا أقصر";
        return;
      }

      const reader = new FileReader();

      reader.onloadend = function() {
        if (socket && socket.connected) {
          socket.emit("voice message", {
            name: document.getElementById("username").value.trim() || "عبود",
            audio: reader.result
          });
          status.textContent = "تم إرسال الصوت ✅";
        } else {
          status.textContent = "الخادم غير متصل، لم يُرسل الصوت";
        }
      };

      reader.readAsDataURL(audioBlob);
    };

    recorder.start();
    status.textContent = "🔴 جاري التسجيل، اضغط للإيقاف";
  } catch (error) {
    status.textContent = "تعذر تشغيل الميكروفون";
  }
});


</script>
